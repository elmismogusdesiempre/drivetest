<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Simulacro de Conducción Colombia</title>
<style>
:root{
  --ink:#101828; --muted:#667085; --bg:#f2f3f6; --card:#ffffff; --soft:#eef0f5; --soft2:#e3e7ef;
  --blue:#003893; --blue2:#0a4cc4; --yellow:#fcd116; --red:#ce1126;
  --ok:#17a05d; --okbg:#d9f4e5; --bad:#d92d3f; --badbg:#fde1e4;
}
*{box-sizing:border-box;border-radius:0;margin:0;padding:0}
html{color-scheme:light}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45;min-height:100vh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;outline:0;background:none;cursor:pointer}
button:focus-visible{background-image:linear-gradient(rgba(252,209,22,.35),rgba(252,209,22,.35))}
img{display:block}
.flag{height:6px;background:linear-gradient(90deg,var(--yellow) 50%,var(--blue) 50% 75%,var(--red) 75%)}
.wrap{max-width:780px;margin:0 auto;padding:0 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 8px;gap:12px}
.brand{font-weight:800;letter-spacing:.06em;font-size:13px;color:var(--blue);text-transform:uppercase}
.icon{width:40px;height:40px;background:var(--card);font-size:18px;display:grid;place-items:center}
.icon:hover{background:var(--soft2)}
h1{font-size:clamp(28px,6vw,40px);line-height:1.08;letter-spacing:-.02em;margin:18px 0 8px}
h1 em{font-style:normal;background:var(--yellow);padding:0 6px}
.lead{color:var(--muted);max-width:56ch}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}
.stat{background:var(--card);padding:14px 16px}
.stat b{display:block;font-size:26px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:640px){.grid{grid-template-columns:1fr}.stats b{font-size:22px}}
.mode{background:var(--card);padding:20px;display:flex;flex-direction:column;gap:12px}
.mode h2{font-size:18px}
.mode p{color:var(--muted);font-size:14px;flex:1}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.seg{display:flex;gap:4px}
.seg button{flex:1;padding:10px 0;background:var(--soft);font-weight:700}
.seg button.on{background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{padding:9px 12px;background:var(--soft);font-size:14px;font-weight:600}
.chips button:hover{background:var(--soft2)}
.btn{padding:13px 18px;background:var(--blue);color:#fff;font-weight:700;text-align:center}
.btn:hover{background:var(--blue2)}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.alt:hover{background:var(--soft2)}
.btn.yellow{background:var(--yellow);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.foot{margin-top:28px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
.foot button{color:var(--blue);font-size:12px;text-decoration:underline}
.notice{background:#fff6c7;padding:10px 14px;font-size:13px;margin:12px 0}

/* quiz */
.qtop{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.qtop .count{font-weight:800}
.qtop .sp{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:800;background:var(--card);padding:8px 12px;min-width:76px;text-align:center}
.timer.low{background:var(--badbg);color:var(--bad)}
.bar{height:6px;background:var(--soft2)}
.bar i{display:block;height:100%;background:var(--blue);transition:width .25s}
.card{background:var(--card);padding:20px;margin-top:10px;position:relative;overflow:hidden}
.cat{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:8px}
.sign{background:#f7f8fb;display:grid;place-items:center;height:230px;margin:0 0 16px;position:relative}
.sign img{max-height:200px;max-width:80%;object-fit:contain;opacity:0;transition:opacity .2s}
.sign img.in{opacity:1}
.sign .code{position:absolute;right:8px;top:8px;font-size:11px;font-weight:700;background:var(--yellow);padding:3px 7px;display:none}
.reveal .sign .code{display:block}
.q{font-size:clamp(18px,3.6vw,22px);font-weight:700;line-height:1.3;margin-bottom:16px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;background:var(--soft);min-height:56px;transition:background .12s,transform .06s}
.opt:hover{background:var(--soft2)}
.opt:active{transform:scale(.995)}
.opt .k{flex:none;width:28px;height:28px;display:grid;place-items:center;background:#fff;font-weight:800;font-size:13px}
.opt.sel{background:#dbe6ff}
.opt.ok{background:var(--okbg)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.no{background:var(--badbg)}
.opt.no .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.reveal .opt{cursor:default}
.imgopts{grid-template-columns:1fr 1fr}
.imgopts .opt{flex-direction:column;padding:12px;gap:8px}
.imgopts .opt img{height:120px;max-width:100%;object-fit:contain;opacity:0;transition:opacity .2s}
.imgopts .opt img.in{opacity:1}
.fb{margin-top:12px;padding:14px 16px;display:none}
.fb.show{display:block;animation:rise .2s}
.fb.good{background:var(--okbg)}
.fb.bad{background:var(--badbg)}
.fb strong{display:block;margin-bottom:4px}
.fb p{font-size:14px}
.next{margin-top:12px;display:flex;justify-content:flex-end}
.pop{position:absolute;right:18px;top:12px;font-size:52px;line-height:1;pointer-events:none;opacity:0;z-index:2}
.pop.go{animation:pop .9s ease-out}
.shake{animation:shake .35s}
@keyframes pop{0%{opacity:0;transform:scale(.3)}25%{opacity:1;transform:scale(1.25)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-10px) scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

/* results */
.res{background:var(--card);padding:28px 20px;text-align:center;margin-top:12px}
.res .big{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1}
.res .verdict{display:inline-block;margin-top:12px;padding:6px 12px;font-weight:800;font-size:13px;letter-spacing:.05em;text-transform:uppercase}
.verdict.pass{background:var(--okbg);color:#0c6b3b}
.verdict.fail{background:var(--badbg);color:#a31828}
.verdict.neutral{background:var(--yellow)}
.meta{display:flex;justify-content:center;gap:24px;margin-top:16px;color:var(--muted);font-size:14px}
.meta b{color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;justify-content:center}
.fails h3{margin:24px 0 8px;font-size:16px}
.fail{background:var(--card);padding:14px;display:flex;gap:14px;margin-bottom:8px;align-items:flex-start}
.fail img{width:84px;height:84px;object-fit:contain;background:#f7f8fb;flex:none}
.fail p{font-size:14px}
.fail .a{color:#0c6b3b;font-weight:700}
.fail .b{color:var(--bad)}
.fail .c{color:var(--muted);font-size:12px;margin-top:4px}

/* auditoría */
.audit{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.tile{background:var(--card);padding:10px;text-align:center;font-size:12px}
.tile .im{height:110px;display:grid;place-items:center;background:#f7f8fb;margin-bottom:6px}
.tile img{max-width:90%;max-height:100px}
.tile b{display:block}
.tile.err{background:var(--badbg)}
.tile.err .im::after{content:"no carga";color:var(--bad);font-weight:700}
.tile.good .im::after{content:""}
.sum{background:var(--card);padding:14px 16px;margin-top:10px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ============================================================
   BANCO UNIFICADO (250 preguntas = señales + inversas + texto)
   ============================================================ */
const SIGNS = SIGNS_RAW.trim().split("\n").map(l=>{
  const [code,meaning]=l.split("|"); const g = code.startsWith("SP")?"P":code.startsWith("SI")?"I":"R";
  return {code,meaning,g};
});
const BANK = (()=>{
  const out=[];
  SIGNS.forEach(s=>out.push({id:"S:"+s.code,kind:"sign",cat:GROUPS[s.g].cat,s}));
  const need = CONFIG.TOTAL_BANK - SIGNS.length - TEXT_RAW.length;
  const step = SIGNS.length/Math.max(need,1);
  for(let i=0;i<need;i++){ const s=SIGNS[Math.min(SIGNS.length-1,Math.floor(i*step+step/2))]; out.push({id:"R:"+s.code,kind:"rev",cat:GROUPS[s.g].cat,s}); }
  TEXT_RAW.forEach((t,i)=>out.push({id:"T:"+i,kind:"text",cat:t[0],t}));
  return out;
})();
const BY_ID = Object.fromEntries(BANK.map(q=>[q.id,q]));
const isSignQ = q => q.kind!=="text";

/* ============================================================
   UTILIDADES
   ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const imgUrl = (code,w)=>CONFIG.IMG_BASE+CONFIG.IMG_PREFIX+code+".svg?width="+w;
const fmt = s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Almacenamiento (con respaldo en memoria si el navegador lo bloquea) */
const mem={};
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return k in mem?mem[k]:d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}}
};
const getFails=()=>store.get("sc_fails",[]).filter(id=>BY_ID[id]);
const setFails=a=>store.set("sc_fails",[...new Set(a)]);
const getHist=()=>store.get("sc_hist",[]);
const pushHist=h=>{const a=getHist();a.unshift(h);store.set("sc_hist",a.slice(0,30))};

   ============================================================ */
let AC=null, muted=store.get("sc_muted",false);
function ctx(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}} if(AC&&AC.state==="suspended")AC.resume(); return AC }
function tone(f,t0,d,type="sine",g=.16,slide){
  const c=ctx(); if(!c||muted)return;
  const o=c.createOscillator(), v=c.createGain(), t=c.currentTime+t0;
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  v.gain.setValueAtTime(0.0001,t); v.gain.exponentialRampToValueAtTime(g,t+.015); v.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(v).connect(c.destination); o.start(t); o.stop(t+d+.05);
}
const sfx={
  click(){tone(620,0,.05,"triangle",.07)},
  ok(){tone(880,0,.14,"triangle",.14);tone(1318,.09,.32,"triangle",.14);tone(2637,.09,.25,"sine",.03)},        // campanita ascendente
  bad(){tone(240,0,.16,"square",.07,170);tone(160,.14,.3,"square",.07,110)},                                      // zumbido grave descendente
  tick(){tone(1000,0,.04,"square",.04)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.28,"triangle",.13))},
  lose(){[392,349,311].forEach((f,i)=>tone(f,i*.16,.3,"triangle",.1))},
  pick(){tone(520,0,.06,"sine",.09)}
};

/* ============================================================
   IMÁGENES: precarga con tiempo límite y registro de fallos
   ============================================================ */
const imgState={}; // clave url -> true/false
function preload(url){
  if(url in imgState) return Promise.resolve(imgState[url]);
  return new Promise(res=>{
    const im=new Image(); let done=false;
    const fin=ok=>{if(done)return;done=true;imgState[url]=ok;res(ok)};
    im.onload=()=>fin(true); im.onerror=()=>fin(false);
    im.referrerPolicy="no-referrer"; im.src=url;
    setTimeout(()=>fin(false),CONFIG.IMG_TIMEOUT);
  });
}

/* ============================================================
   CONSTRUCCIÓN DE UNA PREGUNTA PRESENTABLE
   ============================================================ */
function build(q){
  if(q.kind==="sign"){
    const same=SIGNS.filter(x=>x.g===q.s.g && x.meaning!==q.s.meaning);
    const wrong=shuffle(same).slice(0,3);
    const opts=shuffle([{t:q.s.meaning,ok:true},...wrong.map(w=>({t:w.meaning,ok:false}))]);
    return {q,cat:q.cat,prompt:"¿Qué significa esta señal?",img:imgUrl(q.s.code,460),code:q.s.code,opts,
      exp:q.s.code+" · "+q.s.meaning+". "+GROUPS[q.s.g].tip,
      imgs:[imgUrl(q.s.code,460)]};
  }
  if(q.kind==="rev"){
    const same=SIGNS.filter(x=>x.g===q.s.g && x.code!==q.s.code && x.meaning!==q.s.meaning);
    const wrong=shuffle(same).slice(0,3);
    const opts=shuffle([{img:imgUrl(q.s.code,300),code:q.s.code,ok:true},...wrong.map(w=>({img:imgUrl(w.code,300),code:w.code,ok:false}))]);
    return {q,cat:q.cat,prompt:"¿Cuál de estas señales indica: «"+q.s.meaning+"»?",opts,
      exp:q.s.code+" · "+q.s.meaning+". "+GROUPS[q.s.g].tip,imgs:opts.map(o=>o.img)};
  }
  const [cat,txt,right,w1,w2,w3,exp]=q.t;
  return {q,cat,prompt:txt,opts:shuffle([{t:right,ok:true},{t:w1,ok:false},{t:w2,ok:false},{t:w3,ok:false}]),exp,imgs:[]};
}

/* ============================================================
   SESIÓN
   ============================================================ */
let S=null, timerId=null, offlineWarned=false;
const app=$("#app");

function weightedQueue(n,share){
  const signs=shuffle(BANK.filter(isSignQ)), texts=shuffle(BANK.filter(q=>!isSignQ(q)));
  const ns=Math.round(n*share), out=[];
  for(let i=0;i<n;i++){
    const wantSign=i<ns;
    out.push(wantSign?signs[i%signs.length]:texts[(i-ns)%texts.length]);
  }
  return shuffle(out).map(q=>q.id);
}
function miniQueue(){
  // intercala señales y texto con la proporción pedida
  const s=shuffle(BANK.filter(isSignQ)), t=shuffle(BANK.filter(q=>!isSignQ(q))); const out=[]; let i=0,j=0;
  while(i<s.length||j<t.length){
    const r=Math.random();
    if((r<CONFIG.MINI_SIGN_SHARE&&i<s.length)||j>=t.length) out.push(s[i++]); else out.push(t[j++]);
  }
  return out.map(q=>q.id);
}

function start(mode,opt={}){
  ctx(); sfx.click(); stopTimer();
  S={mode,idx:0,ok:0,total:0,wrong:[],log:[],t0:Date.now(),locked:false,cur:null,skipped:0,textOnly:false,queue:[],limit:0,deadline:0};
  if(mode==="mini"){S.limit=opt.minutes*60;S.queue=miniQueue();S.deadline=Date.now()+S.limit*1000;}
  if(mode==="exam"){S.limit=CONFIG.EXAM_MINUTES*60;S.queue=weightedQueue(CONFIG.EXAM_QUESTIONS,CONFIG.EXAM_SIGN_SHARE);S.deadline=Date.now()+S.limit*1000;S.n=CONFIG.EXAM_QUESTIONS;}
  if(mode==="cat"){S.cat=opt.cat;S.queue=shuffle(BANK.filter(q=>q.cat===opt.cat)).slice(0,CONFIG.PRACTICE_LEN).map(q=>q.id);S.n=S.queue.length;}
  if(mode==="review"){S.queue=shuffle(getFails());S.n=S.queue.length;}
  if(!S.queue.length){home();return}
  app.innerHTML='<div class="loading">Preparando preguntas…</div>';
  nextQ(); if(S.deadline) timerId=setInterval(tickTimer,250);
}
function stopTimer(){clearInterval(timerId);timerId=null}
function tickTimer(){
  if(!S){stopTimer();return}
  const left=(S.deadline-Date.now())/1000, el=$("#timer");
  if(el){el.textContent=fmt(left);const low=left<=10;el.classList.toggle("low",low);
    const sec=Math.ceil(left); if(low&&left>0&&S._lastTick!==sec){S._lastTick=sec;sfx.tick()}}
  if(left<=0){finish(true)}
}

async function nextQ(){
  if(!S)return;
  const mySession=S;
  while(true){
    if(!S.queue.length){
      if(S.mode==="mini"){S.queue=miniQueue()} else {finish(false);return}
    }
    if(S.mode!=="mini"&&S.mode!=="exam"||S.mode==="exam"){/* nada */}
    const q=BY_ID[S.queue.shift()];
    if(S.textOnly&&isSignQ(q)) continue;
    const p=build(q);
    if(p.imgs.length){
      const slow=setTimeout(()=>{if(S===mySession&&!S.cur)app.innerHTML='<div class="loading">Cargando señal…</div>'},350);
      const oks=await Promise.all(p.imgs.map(preload));
      clearTimeout(slow);
      if(S!==mySession)return;
      if(!oks.every(Boolean)){
        S.skipped++;
        if(S.skipped>=6&&!S.textOnly){S.textOnly=true;S.offline=true;}
        continue;
      }
    }
    S.cur=p;S.locked=false;S.chosen=null;
    render();
    // precarga de la siguiente
    const nx=BY_ID[S.queue[0]]; if(nx&&isSignQ(nx)){build(nx).imgs.forEach(preload)}
    return;
  }
}

function render(){
  const p=S.cur, exam=S.mode==="exam";
  const total=S.n||null;
  const num=S.idx+1;
  const progress= total? (S.idx/total*100) : Math.min(100,(Date.now()-S.t0)/1000/S.limit*100);
  const letters=["A","B","C","D"];
  const imgMode=p.opts[0].img;
  app.innerHTML=`
    <div class="qtop">
      <button class="icon" id="exit" aria-label="Salir">✕</button>
      <span class="count">${total?`Pregunta ${num} de ${total}`:`Pregunta ${num} · ${S.ok} ✓`}</span>
      <span class="sp"></span>
      ${S.deadline?`<span class="timer" id="timer">${fmt((S.deadline-Date.now())/1000)}</span>`:""}
      <button class="icon" id="mute" aria-label="Sonido">${muted?"🔇":"🔔"}</button>
    </div>
    <div class="bar"><i style="width:${progress}%"></i></div>
    ${S.offline&&!offlineWarned?'<div class="notice">Algunas señales no cargaron (¿sin internet?). Se mostrarán solo preguntas de texto.</div>':''}
    <section class="card" id="card">
      <div class="cat">${esc(CATS[p.cat]||p.cat)}</div>
      ${p.img?`<div class="sign"><img src="${p.img}" alt="Señal de tránsito" referrerpolicy="no-referrer" onload="this.classList.add('in')"><span class="code">${esc(p.code)}</span></div>`:""}
      <h2 class="q">${esc(p.prompt)}</h2>
      <div class="opts ${imgMode?"imgopts":""}">
        ${p.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${letters[i]}</span>${o.img?`<img src="${o.img}" alt="Opción ${letters[i]}" referrerpolicy="no-referrer" onload="this.classList.add('in')">`:`<span>${esc(o.t)}</span>`}</button>`).join("")}
      </div>
      <div class="pop" id="pop"></div>
      <div class="fb" id="fb" role="status" aria-live="polite"></div>
      <div class="next" id="nextwrap" style="display:none"><button class="btn" id="next"></button></div>
    </section>`;
  if(S.offline)offlineWarned=true;
}

function choose(i){
  if(!S||!S.cur||S.locked)return;
  const p=S.cur, exam=S.mode==="exam", o=p.opts[i];
  const card=$("#card"), btns=[...document.querySelectorAll(".opt")];
  if(exam){
    // en el simulacro se puede cambiar la respuesta antes de continuar
    S.chosen=i; sfx.pick();
    btns.forEach((b,k)=>b.classList.toggle("sel",k===i));
    const w=$("#nextwrap"); w.style.display="flex";
    const last=S.idx+1>=S.n; const nb=$("#next"); nb.textContent=last?"Finalizar":"Siguiente →";
    return;
  }
  S.locked=true; S.total++;
  const right=p.opts.findIndex(x=>x.ok);
  card.classList.add("reveal");
  btns.forEach((b,k)=>{b.classList.add(k===right?"ok":(k===i?"no":"dim"))});
  const pop=$("#pop"), fb=$("#fb");
  if(o.ok){
    S.ok++; sfx.ok(); pop.textContent="✅"; fb.className="fb show good";
    fb.innerHTML=`<strong>¡Correcto!</strong><p>${esc(p.exp)}</p>`;
    if(S.mode==="review") setFails(getFails().filter(id=>id!==p.q.id));
  } else {
    sfx.bad(); pop.textContent="❌"; fb.className="fb show bad"; card.classList.add("shake");
    const ans=p.opts[right]; const txt=ans.t||("la señal "+ans.code);
    fb.innerHTML=`<strong>Incorrecto</strong><p>Respuesta correcta: <b>${esc(txt)}</b>.<br>${esc(p.exp)}</p>`;
    S.wrong.push({p,chosen:o}); setFails([...getFails(),p.q.id]);
  }
  pop.classList.remove("go"); void pop.offsetWidth; pop.classList.add("go");
  S.log.push({id:p.q.id,ok:o.ok});
  const last = S.n && S.idx+1>=S.n;
  const nb=$("#next"); nb.textContent=last?"Ver resultados":"Siguiente →"; $("#nextwrap").style.display="flex";
  if(S.mode==="mini"&&o.ok){ S._auto=setTimeout(()=>{if(S&&S.cur===p)advance()},1000); }
}

function advance(){
  if(!S||!S.cur)return;
  clearTimeout(S._auto);
  const p=S.cur;
  if(S.mode==="exam"){
    if(S.chosen==null)return; // debe elegir
    const o=p.opts[S.chosen]; S.total++;
    if(o.ok)S.ok++; else {S.wrong.push({p,chosen:o}); setFails([...getFails(),p.q.id]);}
    S.log.push({id:p.q.id,ok:o.ok});
  } else if(!S.locked) return;
  sfx.click();
  S.idx++;
  S.cur=null;
  const oldCard=$("#card"); if(oldCard)oldCard.style.pointerEvents="none";
  if(S.n&&S.idx>=S.n){finish(false);return}
  nextQ();
}

function finish(timeUp){
  if(!S)return; stopTimer(); clearTimeout(S._auto);
  const s=S; S=null;
  // en el simulacro, lo que quedó sin responder cuenta como no respondido
  const secs=Math.min((Date.now()-s.t0)/1000, s.limit||1e9);
  const total = s.mode==="exam"? CONFIG.EXAM_QUESTIONS : s.total;
  const pct = total? Math.round(s.ok/total*100) : 0;
  pushHist({d:Date.now(),mode:s.mode,ok:s.ok,total,secs:Math.round(secs)});
  if(s.mode==="exam"?pct>=CONFIG.PASS_RATIO*100:pct>=70)sfx.win(); else sfx.lose();
  results(s,total,pct,secs,timeUp);
}

function results(s,total,pct,secs,timeUp){
  const names={mini:"Mini-test",exam:"Simulacro completo",cat:"Práctica: "+(CATS[s.cat]||""),review:"Repaso de fallos"};
  const exam=s.mode==="exam";
  const pass=pct>=CONFIG.PASS_RATIO*100;
  const verdict=exam?`<span class="verdict ${pass?"pass":"fail"}">${pass?"Aprobado":"No aprobado"} · mínimo ${Math.round(CONFIG.PASS_RATIO*100)}%</span>`
                    :`<span class="verdict neutral">${pct>=80?"¡Muy bien!":pct>=60?"Vas por buen camino":"A repasar un poco más"}</span>`;
  const fails=s.wrong;
  app.innerHTML=`
    <div class="top"><span class="brand">${esc(names[s.mode])}</span><button class="icon" id="mute">${muted?"🔇":"🔔"}</button></div>
    <div class="res">
      <div class="big">${pct}%</div>
      ${verdict}
      <div class="meta"><span><b>${s.ok}</b> de <b>${total}</b> correctas</span><span><b>${fmt(secs)}</b> de tiempo</span></div>
      ${timeUp?'<p class="lead" style="margin:12px auto 0">Se acabó el tiempo.</p>':''}
      <div class="actions">
        <button class="btn" data-act="again">Jugar otra vez</button>
        ${fails.length||getFails().length?'<button class="btn yellow" data-act="review">Repasar fallos</button>':""}
        <button class="btn alt" data-act="home">Inicio</button>
      </div>
    </div>
    ${fails.length?`<div class="fails"><h3>Lo que fallaste (${fails.length})</h3>
      ${fails.map(f=>{const p=f.p, right=p.opts.find(o=>o.ok);
        const thumb=p.img?`<img src="${p.img}" alt="">`:(right.img?`<img src="${right.img}" alt="">`:"");
        return `<div class="fail">${thumb}<div><p><b>${esc(p.prompt)}</b></p>
          <p class="b">Tu respuesta: ${esc(f.chosen.t||("señal "+f.chosen.code))}</p>
          <p class="a">Correcta: ${esc(right.t||("señal "+right.code))}</p>
          <p class="c">${esc(p.exp)}</p></div></div>`}).join("")}</div>`:""}
  `;
  app._last={mode:s.mode,minutes:s.limit&&s.mode==="mini"?s.limit/60:null,cat:s.cat};
  window.scrollTo(0,0);
}

/* ============================================================
   INICIO
   ============================================================ */
let miniMin=3;
function home(){
  S=null; stopTimer(); offlineWarned=false;
  const fails=getFails().length, hist=getHist();
  const bestExam=hist.filter(h=>h.mode==="exam").reduce((m,h)=>Math.max(m,Math.round(h.ok/h.total*100)),0);
  const nSigns=BANK.filter(isSignQ).length;
  app.innerHTML=`
    <div class="top"><span class="brand">Simulacro · Conducción Colombia</span><button class="icon" id="mute" aria-label="Sonido">${muted?"🔇":"🔔"}</button></div>
    <h1>Practica el examen teórico de <em>conducción</em></h1>
    <p class="lead">Banco de ${BANK.length} preguntas con las señales de tránsito del Manual de Señalización Vial de Colombia. Elige cómo quieres practicar.</p>
    <div class="stats">
      <div class="stat"><b>${BANK.length}</b><span>Preguntas</span></div>
      <div class="stat"><b>${nSigns}</b><span>De señales</span></div>
      <div class="stat"><b>${fails}</b><span>Por repasar</span></div>
    </div>
    <div class="grid">
      <div class="mode">
        <span class="tag">Rápido</span><h2>Mini-test por tiempo</h2>
        <p>Responde todas las que puedas mientras corre el reloj. Ideal para ratos libres.</p>
        <div class="seg" id="seg">${[1,3,5].map(m=>`<button data-m="${m}" class="${m===miniMin?"on":""}">${m} min</button>`).join("")}</div>
        <button class="btn" data-act="mini">Jugar ${miniMin} minutos</button>
      </div>
      <div class="mode">
        <span class="tag">Examen</span><h2>Simulacro completo</h2>
        <p>${CONFIG.EXAM_QUESTIONS} preguntas, ${CONFIG.EXAM_MINUTES} minutos, sin ayudas hasta el final.${bestExam?` Tu mejor: <b>${bestExam}%</b>.`:""}</p>
        <button class="btn" data-act="exam">Empezar simulacro</button>
      </div>
      <div class="mode">
        <span class="tag">Por tema</span><h2>Práctica por categoría</h2>
        <p>${CONFIG.PRACTICE_LEN} preguntas con explicación inmediata.</p>
        <div class="chips">${Object.keys(CATS).map(c=>`<button data-cat="${c}">${esc(CATS[c])}</button>`).join("")}</div>
      </div>
      <div class="mode">
        <span class="tag">Refuerzo</span><h2>Repaso de fallos</h2>
        <p>${fails?`Tienes ${fails} pregunta${fails>1?"s":""} por reforzar. Si las aciertas, salen de la lista.`:"Aquí aparecerán las preguntas que falles para que las repases."}</p>
        <button class="btn ${fails?"yellow":"alt"}" data-act="review" ${fails?"":"disabled"}>Repasar ${fails||""}</button>
      </div>
    </div>
    <div class="foot">
      <span>Imágenes: Wikimedia Commons (licencias libres). Las reglas pueden cambiar: confirma con tu escuela de conducción y la norma vigente.</span>
      <button data-act="audit">Verificar señales</button>
    </div>`;
}

/* ============================================================
   VERIFICACIÓN DE SEÑALES (muestra cuáles cargan y cuáles no)
   ============================================================ */
function audit(){
  S=null; stopTimer();
  app.innerHTML=`
    <div class="top"><span class="brand">Verificar señales</span><button class="btn alt" data-act="home">Volver</button></div>
    <p class="lead">Cada señal se pide a Wikimedia Commons. Revisa que la imagen coincida con el significado. Las marcadas en rojo no cargaron: se omiten solas en los tests.</p>
    <div class="sum" id="sum">Comprobando…</div>
    <div class="audit">${SIGNS.map(s=>`<div class="tile" data-c="${s.code}"><div class="im"><img src="${imgUrl(s.code,220)}" alt="${s.code}" referrerpolicy="no-referrer"></div><b>${s.code}</b>${esc(s.meaning)}</div>`).join("")}</div>`;
  let done=0,bad=0; const n=SIGNS.length;
  document.querySelectorAll(".tile img").forEach(im=>{
    const fin=ok=>{done++; if(!ok){bad++;im.closest(".tile").classList.add("err");im.remove()}
      $("#sum").textContent=`${done-bad} cargan · ${bad} no cargan · ${n-done} pendientes`;};
    if(im.complete&&im.naturalWidth)fin(true); else {im.onload=()=>fin(true);im.onerror=()=>fin(false)}
  });
}

/* ============================================================
   EVENTOS
   ============================================================ */
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t)return;
  if(t.id==="mute"){muted=!muted;store.set("sc_muted",muted);t.textContent=muted?"🔇":"🔔";if(!muted){ctx();sfx.click()}return}
  if(t.id==="exit"){ if(S&&S.total>0&&S.mode!=="exam"){finish(false)} else if(confirm("¿Salir del test?")){S=null;stopTimer();home()} return}
  if(t.id==="next"){advance();return}
  if(t.classList.contains("opt")){choose(+t.dataset.i);return}
  if(t.dataset.m){miniMin=+t.dataset.m;ctx();sfx.pick();home();return}
  if(t.dataset.cat){start("cat",{cat:t.dataset.cat});return}
  const a=t.dataset.act; if(!a)return;
  if(a==="mini")start("mini",{minutes:miniMin});
  else if(a==="exam")start("exam");
  else if(a==="review")start("review");
  else if(a==="home"){ctx();sfx.click();home()}
  else if(a==="audit")audit();
  else if(a==="again"){const l=app._last||{};if(l.mode==="mini")start("mini",{minutes:l.minutes||3});else if(l.mode==="cat")start("cat",{cat:l.cat});else start(l.mode||"exam")}
});
document.addEventListener("keydown",e=>{
  if(!S||!S.cur)return;
  const k=e.key.toLowerCase(), map={"1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3};
  if(k in map&&!e.ctrlKey&&!e.metaKey){choose(map[k]);}
  else if((k==="enter"||k===" ")&&$("#nextwrap")&&$("#nextwrap").style.display!=="none"){e.preventDefault();advance()}
});

window.addEventListener("hashchange",()=>{ if(location.hash==="#verificar")audit(); else home(); });
if(location.hash==="#verificar")audit(); else home();
</script>
